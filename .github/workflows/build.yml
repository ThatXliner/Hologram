name: Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and verify
        required: false
        default: ""
        type: string

jobs:
  build:
    # Only run CI builds on non-tag pushes and PRs
    if: "!startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.release_tag != '')"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ORT_CACHE_DIR: ${{ github.workspace }}/.cache/ort
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies for Tauri (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install libvips (macOS only)
        if: startsWith(matrix.os, 'macos-')
        run: brew install vips

      - name: Install dependencies
        run: bun install

      - name: ONNX Runtime cache
        uses: actions/cache@v4
        with:
          path: .cache/ort
          key: ${{ runner.os }}-ort-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ort-

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Refresh ONNX Runtime build metadata
        working-directory: src-tauri
        run: cargo clean -p ort-sys

      - name: Build the app
        run: bun run tauri build --ci --config src-tauri/tauri.ci.conf.json

      - name: Verify decision book file export
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib decision_book::tests --locked

      - name: Verify XMP import and persistence
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib xmp_import::tests --locked

      - name: Verify packaged native learner
        run: |
          cargo build --release --manifest-path tools/xgboost-eval/Cargo.toml --locked
          bun scripts/verify-native-bundle.ts

      - name: Upload native package report
        uses: actions/upload-artifact@v4
        with:
          name: native-package-${{ runner.os }}
          path: native-package-report.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }} ${{ runner.arch }} artifacts
          path: |
            src-tauri/target/release/bundle/*/*.dmg
            src-tauri/target/release/bundle/*/*.AppImage
            src-tauri/target/release/bundle/*/*.deb
            src-tauri/target/release/bundle/*/*.msi

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-15"
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-latest"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      ORT_CACHE_DIR: ${{ github.workspace }}/.cache/ort
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Verify release target
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG;
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag) || tag !== `v${config.version}`) {
            throw new Error('Release tag must match the checked-out app version');
          }
          NODE

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          pkg-config --exists glib-2.0 gtk+-3.0 webkit2gtk-4.1

      - uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      - name: Install libvips (macOS only)
        if: startsWith(matrix.platform, 'macos-')
        run: brew install vips

      - name: Install frontend dependencies
        run: bun install

      - name: ONNX Runtime cache
        uses: actions/cache@v4
        with:
          path: .cache/ort
          key: ${{ runner.os }}-ort-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ort-

      - name: Refresh ONNX Runtime build metadata
        working-directory: src-tauri
        run: cargo clean -p ort-sys

      - name: Import Apple Developer Certificate
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify Certificate
        if: startsWith(matrix.platform, 'macos-')
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported."

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.release_tag || github.ref_name }}
          releaseName: "Hologram v__VERSION__"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify released native learner
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
        run: |
          cargo build --release --manifest-path tools/xgboost-eval/Cargo.toml --locked
          if [[ "${{ matrix.platform }}" == macos-* ]]; then
            bun scripts/verify-native-bundle.ts src-tauri/target/aarch64-apple-darwin/release/bundle
          else
            bun scripts/verify-native-bundle.ts
          fi

      - name: Upload release native package report
        uses: actions/upload-artifact@v4
        with:
          name: release-native-package-${{ runner.os }}
          path: native-package-report.json

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
